name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Node Dependencies
        run: npm install

      - name: 6. Generate Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Inject Android Manifest Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # 1. Cleartext Traffic
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST

            # 2. Permissions for Background & Screen Lock
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.WAKE_LOCK" \/>' $MANIFEST
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' $MANIFEST
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>' $MANIFEST
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" \/>' $MANIFEST
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" \/>' $MANIFEST
          fi

      - name: 8. Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 9. Upload Artifact APK Result
        uses: actions/upload-artifact@v4
        with:
          name: WemosMonitor-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
